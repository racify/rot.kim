    function applyDiscordBadges(badges) {
      const container = document.getElementById('header-badges');
      if (!container || !Array.isArray(badges) || !badges.length) return;

      container.innerHTML = badges
        .filter(b => b?.icon)
        .map(b => `<img src="https://cdn.discordapp.com/badge-icons/${encodeURIComponent(b.icon)}.png" width="15" height="15" decoding="async" alt="${escapeHtml(b.description || '')}" />`)
        .join('');
    }

    function resolveDiscordActivityIcon(act) {
      if (!act) return '';
      const rawImg = act.assets?.large_image || act.assets?.small_image;
      if (rawImg) {
        if (rawImg.startsWith('mp:external/')) return `https://media.discordapp.net/external/${rawImg.replace('mp:external/', '')}`;
        if (rawImg.startsWith('http')) return isSafeHttpUrl(rawImg) ? rawImg : '';
        if (act.application_id) return `https://cdn.discordapp.com/app-assets/${encodeURIComponent(act.application_id)}/${encodeURIComponent(rawImg)}.png?size=128`;
      }
      return act.application_id ? `https://dcdn.dstn.to/app-icons/${encodeURIComponent(act.application_id)}.png?size=128` : '';
    }

    function extractDiscordMusicRpc(activities) {
      if (!Array.isArray(activities)) return null;
      const act = activities.find(a => a && a.type !== 4 && a.id !== 'spotify:1' && isMusicActivity(a) && a.details);
      if (!act) return null;

      const rawTitle = String(act.details || '').trim();
      if (!rawTitle) return null;

      const rawArtist = String(act.state || '')
        .replace(/^by\s+/i, '')
        .split(/\s*(?:\u2022|\u00b7|\u2014|\s-\s)\s*/)[0]
        .trim();

      const start = Number(act.timestamps?.start || 0);
      const end = Number(act.timestamps?.end || 0);

      return {
        name: rawTitle,
        artist: rawArtist || act.name || '',
        art: resolveDiscordActivityIcon(act),
        url: STATSFM_PROFILE_URL,
        start,
        end,
        durationMs: (start && end && end > start) ? (end - start) : 0,
        platform: detectAppFromActivity(act),
        sourceAct: act
      };
    }

    function getDiscordActivityVerb(type) {
      if (type === 1) return '配信中';
      if (type === 2) return '再生中';
      if (type === 3) return '視聴中';
      if (type === 5) return '参加中';
      return 'プレイ中';
    }

    function attachDirectImage(imgEl, fbEl, url) {
      if (!imgEl || !url || !isSafeHttpUrl(url)) return;
      if (imgEl.dataset.srcUrl === url && imgEl.complete && imgEl.naturalWidth > 0) return;

      const discWrap = imgEl.closest('.music-disc-wrap');

      const show = () => {
        if (imgEl.dataset.srcUrl !== url) return;
        imgEl.style.display = 'block';
        if (fbEl) fbEl.style.display = 'none';
        discWrap?.classList.add('has-art');
      };

      const hide = () => {
        if (imgEl.dataset.srcUrl !== url) return;
        imgEl.style.display = 'none';
        if (fbEl) fbEl.style.display = 'block';
        discWrap?.classList.remove('has-art');
      };

      imgEl.dataset.srcUrl = url;
      imgEl.onload = show;
      imgEl.onerror = hide;
      imgEl.src = url;
      if (imgEl.complete && imgEl.naturalWidth > 0) show();
    }

    const activityNodeMap = new Map();
    let activityHeightTimer = null;
    let activityRafId = null;

    function buildActivityElement(item, enterIdx) {
      const isMusic = item.kind === 'music';
      const el = document.createElement('div');
      el.setAttribute('role', 'link');
      el.setAttribute('tabindex', '0');
      el.setAttribute('data-href', item.href);
      el.className = `activity-item is-entering${isMusic ? ' is-music' : ''}`;
      el.style.setProperty('--enter-idx', String(enterIdx));

      const artMarkup = isMusic
        ? `
          <div class="music-disc-wrap">
            <div class="music-disc-rotor">
              <span class="act-fb font-mono t-muted" aria-hidden="true">${item.fallbackGlyph}</span>
              <img alt="" decoding="async" class="act-art" />
            </div>
            <span class="music-disc-hole" aria-hidden="true"></span>
          </div>
        `
        : `
          <div class="activity-art-frame">
            <div class="activity-art-box">
              <span class="act-fb font-mono t-muted" aria-hidden="true">${item.fallbackGlyph}</span>
              <img alt="" decoding="async" class="act-art" />
            </div>
          </div>
        `;

      const progressHtml = isMusic
        ? `
          <div class="song-progress-rail">

            <span class="rail-star rail-star-2" aria-hidden="true">&#10023;</span>
            <span class="rail-star rail-star-3" aria-hidden="true">&#10022;</span>
            <div class="song-progress-fill"></div>
            <div class="progress-head-track" aria-hidden="true">
              <span class="progress-head">
                <svg class="progress-head-star" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 0.5C8.6 4.7 11.3 7.4 15.5 8C11.3 8.6 8.6 11.3 8 15.5C7.4 11.3 4.7 8.6 0.5 8C4.7 7.4 7.4 4.7 8 0.5Z"/>
                </svg>
                <span class="head-sparkle sp-1">&#10022;</span>
                <span class="head-sparkle sp-2">&#10023;</span>
                <span class="head-sparkle sp-3">&#10022;</span>
                <span class="head-dot"></span>
              </span>
            </div>
          </div>
        `
        : '';

      el.innerHTML = `
        <div class="act-row">
          <div class="act-left">
            ${artMarkup}
            <div class="act-text">
              <div class="act-title heading-fancy t-strong truncate">${escapeHtml(item.title)}</div>
              <div class="act-sub-row">
                <span class="act-ornament" aria-hidden="true">${STAR_SVG_MARKUP}</span>
                <span class="act-sub t-muted truncate">${escapeHtml(item.subtitle)}</span>
              </div>
            </div>
          </div>
          <div class="act-right tabular">
            <div class="act-rt t-primary font-mono">${escapeHtml(item.rightTop)}</div>
            <div class="act-rb heading-fancy t-muted">${escapeHtml(item.rightBottom)}</div>
          </div>
        </div>
        ${progressHtml}
      `;

      const onEnterEnd = (ev) => {
        if (ev.target !== el) return;
        el.classList.remove('is-entering');
        el.removeEventListener('animationend', onEnterEnd);
      };
      el.addEventListener('animationend', onEnterEnd);

      if (isMusic) {
        el._progressRefs = {
          rail: el.querySelector('.song-progress-rail'),
          fill: el.querySelector('.song-progress-fill'),
          track: el.querySelector('.progress-head-track')
        };
      }

      const artEl = el.querySelector('.act-art');
      const fbEl = el.querySelector('.act-fb');
      if (isMusic) {
        if (item.initialArt) attachDirectImage(artEl, fbEl, item.initialArt);
        const capturedKey = item.key;
        resolveTrackMetadata(item.subtitle, item.title, item.initialArt, item.durationMs).then(meta => {
          if (activityNodeMap.get(capturedKey) !== el || !el.isConnected) return;
          if (!isUsingExactTimestamps && meta.durationMs > 15000) {
            activeSongDurationMs = meta.durationMs;
            updateSongProgressAndLyrics();
          }
          if (meta.art && artEl && artEl.dataset.srcUrl !== meta.art) attachDirectImage(artEl, fbEl, meta.art);
        });
      } else if (item.iconUrl) {
        attachDirectImage(artEl, fbEl, item.iconUrl);
      }

      return el;
    }

    function updateActivityElementInPlace(el, item) {
      el.setAttribute('data-href', item.href);
      const subEl = el.querySelector('.act-sub');
      const rtEl = el.querySelector('.act-rt');
      const rbEl = el.querySelector('.act-rb');
      if (subEl && subEl.textContent !== item.subtitle) subEl.textContent = item.subtitle;
      if (rtEl && rtEl.textContent !== item.rightTop) rtEl.textContent = item.rightTop;
      if (rbEl && rbEl.textContent !== item.rightBottom) rbEl.textContent = item.rightBottom;

      const newArt = item.initialArt || item.iconUrl || '';
      const artEl = el.querySelector('.act-art');
      const fbEl = el.querySelector('.act-fb');
      if (newArt && artEl && artEl.dataset.srcUrl !== newArt) attachDirectImage(artEl, fbEl, newArt);
    }

    function animateActivityWrap(hasItems) {
      const wrap = document.getElementById('activity-widget-wrap');
      const inner = document.getElementById('activity-widget-inner');
      if (!wrap || !inner) return;
      if (!hasItems && !wrap.classList.contains('is-open')) return;

      cancelAnimationFrame(activityRafId);
      clearTimeout(activityHeightTimer);
      wrap.style.overflow = 'hidden';
      wrap.style.height = `${wrap.getBoundingClientRect().height}px`;
      void wrap.offsetHeight;

      if (!hasItems) {
        wrap.classList.remove('is-open');
        activityRafId = requestAnimationFrame(() => { wrap.style.height = '0px'; });
        return;
      }

      const targetHeight = inner.scrollHeight;
      wrap.classList.add('is-open');
      activityRafId = requestAnimationFrame(() => {
        wrap.style.height = `${targetHeight}px`;
        activityHeightTimer = setTimeout(() => {
          if (wrap.classList.contains('is-open')) {
            wrap.style.height = 'auto';
            wrap.style.overflow = 'visible';
          }
        }, 460);
      });
    }

    function syncActivityUI() {
      const wrap = document.getElementById('activity-widget-wrap');
      const listEl = document.getElementById('activity-list');
      if (!wrap || !listEl) return;

      const items = [];
      const activeTrack = getActiveMusicTrack();
      const hasMusic = Boolean(activeTrack);

      if (hasMusic) {
        const songTitle = activeTrack.name || '不明なトラック';
        const songArtist = activeTrack.artist || '不明なアーティスト';
        const initialArt = activeTrack.art || statsFmCurrentTrack?.art || '';
        const href = activeTrack.url && isSafeHttpUrl(activeTrack.url) ? activeTrack.url : STATSFM_PROFILE_URL;
        const songKey = `${extractPrimaryArtist(songArtist)}___${songTitle}`.toLowerCase();
        const liveApp = activeMusicApp || activeTrack.platform || null;

        if (activeTrack.start && activeTrack.end && activeTrack.end > activeTrack.start) {
          isUsingExactTimestamps = true;
          activeSongKey = songKey;
          activeSongStartMs = activeTrack.start;
          activeSongDurationMs = Math.max(1000, activeTrack.end - activeTrack.start);
        } else if (activeTrack.start && activeTrack.durationMs > 15000) {
          isUsingExactTimestamps = true;
          activeSongKey = songKey;
          activeSongStartMs = activeTrack.start;
          activeSongDurationMs = activeTrack.durationMs;
        } else {
          isUsingExactTimestamps = false;
          if (activeSongKey !== songKey) {
            activeSongKey = songKey;
            const savedKey = sessionStorage.getItem('__jules_song_key');
            const savedStart = parseInt(sessionStorage.getItem('__jules_song_start') || '0', 10);
            if (savedKey === songKey && savedStart > 0 && (Date.now() - savedStart) < 600000) {
              activeSongStartMs = savedStart;
            } else {
              activeSongStartMs = activeTrack.start || Date.now();
              try {
                sessionStorage.setItem('__jules_song_key', songKey);
                sessionStorage.setItem('__jules_song_start', String(activeSongStartMs));
              } catch (_) {}
            }
          }
          if (activeTrack.durationMs > 15000) activeSongDurationMs = activeTrack.durationMs;
        }

        syncLyricsForSong(songKey, songTitle, songArtist, activeSongDurationMs);

        items.push({
          key: `music:${songKey}`,
          kind: 'music',
          title: songTitle,
          subtitle: songArtist,
          rightTop: getMusicAppJapaneseName(liveApp),
          rightBottom: '再生中',
          href,
          fallbackGlyph: '&#9835;',
          initialArt,
          durationMs: activeSongDurationMs
        });
      } else {
        activeProgressRefs = null;
        lastProgressRatio = -1;
        syncLyricsForSong('', '', '', 0);
      }

      discordOtherActivities.forEach((act) => {
        if (hasMusic && isMusicActivity(act)) return;
        const verb = getDiscordActivityVerb(act.type);
        const name = act.name || 'Discord';
        items.push({
          key: `discord:${act.application_id || ''}:${name.toLowerCase()}`,
          kind: 'discord',
          title: name,
          subtitle: act.details || act.state || verb,
          rightTop: verb,
          rightBottom: 'Discord',
          href: `https://discord.com/users/${encodeURIComponent(DISCORD_ID)}`,
          fallbackGlyph: '&#10022;',
          iconUrl: resolveDiscordActivityIcon(act)
        });
      });

      syncPlaybackTimer();

      const nextKeys = new Set(items.map(it => it.key));
      let structureChanged = false;

      for (const [key, node] of activityNodeMap.entries()) {
        if (!nextKeys.has(key)) {
          node.remove();
          activityNodeMap.delete(key);
          structureChanged = true;
        }
      }

      let newCount = 0;
      items.forEach((item, idx) => {
        let el = activityNodeMap.get(item.key);
        if (el) {
          updateActivityElementInPlace(el, item);
        } else {
          el = buildActivityElement(item, newCount++);
          activityNodeMap.set(item.key, el);
          structureChanged = true;
        }

        if (item.kind === 'music' && activeProgressRefs !== el._progressRefs) {
          activeProgressRefs = el._progressRefs;
          lastProgressRatio = -1;
        }

        if (listEl.children[idx] !== el) {
          listEl.insertBefore(el, listEl.children[idx] || null);
          structureChanged = true;
        }
      });

      if (structureChanged || (items.length > 0 && !wrap.classList.contains('is-open'))) {
        animateActivityWrap(items.length > 0);
      }

      updateSongProgressAndLyrics();
    }

    function setDiscordStatusUI(status) {
      const headerDot = document.getElementById('header-status-dot');
      if (!headerDot) return;
      const normalized = (status || 'offline').toLowerCase();
      if (normalized === 'offline') {
        headerDot.style.display = 'none';
        return;
      }
      const colors = { online: '#23a55a', idle: '#f0b232', dnd: '#f23f43' };
      headerDot.style.backgroundColor = colors[normalized] || colors.dnd;
      headerDot.style.display = 'block';
    }

    async function fetchDstnProfile() {
      const res = await fetchJsonGuarded(`https://dcdn.dstn.to/profile/${DISCORD_ID}`, {
        cacheKey: 'dstn_profile',
        ttlMs: 300000
      });
      if (!res.ok || !res.data) return;
      if (res.data.user) applyUserProfile(res.data.user);
      if (Array.isArray(res.data.badges)) applyDiscordBadges(res.data.badges);
    }

    function handleLanyardPresence(data) {
      if (!data) return;
      if (data.discord_user) applyUserProfile(data.discord_user);
      setDiscordStatusUI(data.discord_status || 'offline');

      const prevLive = getActiveMusicTrack();
      const prevKey = prevLive ? `${prevLive.artist}___${prevLive.name}` : '';

      if (data.listening_to_spotify && data.spotify) {
        const trackId = data.spotify.track_id;
        discordSpotifyActive = {
          name: data.spotify.song,
          artist: data.spotify.artist,
          art: data.spotify.album_art_url || '',
          url: trackId
            ? `https://open.spotify.com/track/${encodeURIComponent(trackId)}`
            : `https://open.spotify.com/search/${encodeURIComponent(`${data.spotify.song} ${data.spotify.artist}`)}`,
          start: data.spotify.timestamps?.start || 0,
          end: data.spotify.timestamps?.end || 0,
          durationMs: (data.spotify.timestamps?.end && data.spotify.timestamps?.start)
            ? Math.max(1000, data.spotify.timestamps.end - data.spotify.timestamps.start)
            : 0,
          platform: 'spotify'
        };
      } else {
        discordSpotifyActive = null;
      }

      const activities = Array.isArray(data.activities) ? data.activities : [];
      discordMusicRpcActive = discordSpotifyActive ? null : extractDiscordMusicRpc(activities);

      activeMusicApp = discordSpotifyActive
        ? 'spotify'
        : (discordMusicRpcActive?.platform || activities.map(detectAppFromActivity).find(Boolean) || null);

      const seenKeys = new Set();
      discordOtherActivities = activities.filter(act => {
        if (!act || act.type === 4 || ![0, 1, 2, 3, 5].includes(act.type)) return false;
        if (discordMusicRpcActive && act === discordMusicRpcActive.sourceAct) return false;
        const key = `${act.application_id || ''}:${(act.name || '').toLowerCase()}`;
        if (seenKeys.has(key)) return false;
        seenKeys.add(key);
        return true;
      });

      syncActivityUI();

      const nextLive = getActiveMusicTrack();
      const nextKey = nextLive ? `${nextLive.artist}___${nextLive.name}` : '';
      if (prevKey !== nextKey || statsFmRecentStreams.length) renderRecentTracks();
    }

    let wsAttempt = 0;
    let activeWs = null;
    let wsReconnectTimer = null;

    function connectLanyardWs() {
      if (document.visibilityState === 'hidden' || navigator.onLine === false) return;
      if (activeWs && (activeWs.readyState === WebSocket.OPEN || activeWs.readyState === WebSocket.CONNECTING)) return;

      clearTimeout(wsReconnectTimer);
      try {
        const ws = new WebSocket('wss://api.lanyard.rest/socket');
        activeWs = ws;
        let hb = null;

        ws.addEventListener('open', () => { wsAttempt = 0; });

        ws.addEventListener('message', (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.op === 1) {
              clearInterval(hb);
              hb = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 }));
              }, msg.d.heartbeat_interval);
              ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
            } else if (msg.op === 0 && (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE')) {
              writeCache('lanyard_init', { success: true, data: msg.d }, 10000);
              handleLanyardPresence(msg.d);
            }
          } catch (_) {}
        });

        ws.addEventListener('close', () => {
          clearInterval(hb);
          if (activeWs === ws) activeWs = null;
          if (document.visibilityState === 'visible' && wsAttempt < 6) {
            const delay = Math.min(30000, 2000 * Math.pow(2, wsAttempt++)) + Math.floor(Math.random() * 1000);
            wsReconnectTimer = setTimeout(connectLanyardWs, delay);
          }
        });
      } catch (_) {}
    }

    function initLanyard() {
      fetchJsonGuarded(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`, {
        cacheKey: 'lanyard_init',
        ttlMs: 10000
      }).then((res) => {
        if (res.ok && res.data?.success && res.data.data) handleLanyardPresence(res.data.data);
      });
      connectLanyardWs();
    }

    function extractStatsFmTrack(rawTrack, platform) {
      if (!rawTrack) return null;
      const artists = Array.isArray(rawTrack.artists)
        ? rawTrack.artists.map(a => a?.name).filter(Boolean).join(', ')
        : (rawTrack.artist || '不明なアーティスト');
      const albumImg = Array.isArray(rawTrack.albums)
        ? (rawTrack.albums.find(a => a?.image)?.image || '')
        : (rawTrack.album?.image || '');
      const spotifyId = rawTrack.externalIds?.spotify?.[0] || '';
      const url = rawTrack.id
        ? `https://stats.fm/track/${encodeURIComponent(rawTrack.id)}`
        : (spotifyId ? `https://open.spotify.com/track/${encodeURIComponent(spotifyId)}` : STATSFM_PROFILE_URL);

      return {
        name: rawTrack.name || '不明なトラック',
        artist: artists || '不明なアーティスト',
        art: albumImg,
        durationMs: Number(rawTrack.durationMs || 0),
        url,
        platform: mapStatsFmPlatform(platform)
      };
    }

    function formatRelativeTimeMs(timestampMs) {
      if (!timestampMs || Number.isNaN(timestampMs)) return '再生済み';
      const diffSec = Math.max(1, Math.floor((Date.now() - timestampMs) / 1000));
      if (diffSec < 60) return `${diffSec}秒前`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}分前`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}時間前`;
      return `${Math.floor(diffHr / 24)}日前`;
    }

    function renderRecentTracks() {
      const recentContainer = document.getElementById('music-view-recent');
      if (!recentContainer) return;

      const combined = [];
      const liveTrack = getActiveMusicTrack();

      if (liveTrack) {
        combined.push({
          name: liveTrack.name,
          artist: liveTrack.artist,
          art: liveTrack.art || '',
          url: liveTrack.url || STATSFM_PROFILE_URL,
          isNow: true,
          app: activeMusicApp || liveTrack.platform || 'spotify',
          durationMs: liveTrack.durationMs || 0
        });
      }

      statsFmRecentStreams.forEach((s) => {
        if (!s) return;
        if (
          combined.length === 1 &&
          combined[0].isNow &&
          normalizeText(s.name) === normalizeText(combined[0].name) &&
          normalizeText(extractPrimaryArtist(s.artist)) === normalizeText(extractPrimaryArtist(combined[0].artist)) &&
          s.endTimeMs &&
          (Date.now() - s.endTimeMs) < 300000
        ) return;
        combined.push(s);
      });

      const slice = combined.slice(0, 8);
      if (!slice.length) {
        lastRecentSignature = '';
        recentContainer.innerHTML = `<div class="music-empty t-muted">最近の再生履歴はありません</div>`;
        return;
      }

      const sig = slice.map(t => `${t.name}:${t.artist}:${t.isNow ? `now_${t.app}` : (t.endTimeMs || '')}`).join('|');
      if (sig === lastRecentSignature) {
        updateRelativeTimes();
        return;
      }
      lastRecentSignature = sig;

      recentContainer.innerHTML = slice.map((t, idx) => {
        const safeUrl = escapeHtml(t.url && isSafeHttpUrl(t.url) ? t.url : STATSFM_PROFILE_URL);
        const rightSlot = t.isNow
          ? getMusicAppBadgeHtml(t.app)
          : `<span class="track-time font-mono tabular t-muted" data-ts="${t.endTimeMs || ''}">${formatRelativeTimeMs(t.endTimeMs)}</span>`;

        return `
          <div role="link" tabindex="0" data-href="${safeUrl}" style="--idx: ${idx}" class="stagger-row interactive-row track-row">
            <span class="track-left">
              <span class="thumb-box sq-8">
                <span id="track-fallback-${idx}" class="track-fb font-mono t-muted" aria-hidden="true">&#9835;</span>
                <img id="track-art-${idx}" alt="" decoding="async" class="act-art" />
              </span>
              <span class="truncate">
                <span class="track-name t-strong">${escapeHtml(t.name || 'トラック')}</span>
                <span class="t-muted"> &middot; ${escapeHtml(t.artist || 'アーティスト')}</span>
              </span>
            </span>
            <span class="track-right">${rightSlot}</span>
          </div>
        `;
      }).join('');

      slice.forEach((t, idx) => {
        const imgEl = document.getElementById(`track-art-${idx}`);
        const fbEl = document.getElementById(`track-fallback-${idx}`);
        if (t.art) {
          attachDirectImage(imgEl, fbEl, t.art);
        } else {
          resolveTrackMetadata(t.artist, t.name, '', t.durationMs || 0).then(meta => {
            if (meta.art && imgEl && imgEl.isConnected) attachDirectImage(imgEl, fbEl, meta.art);
          });
        }
      });
    }

    function applyStatsFmData({ currentData, recentData, totalData, currentFetchedAt }) {
      const totalCount = totalData?.items?.count ?? totalData?.item?.count;
      if (typeof totalCount === 'number' && totalCount > 0) {
        const totalEl = document.getElementById('music-stream-total');
        if (totalEl) totalEl.textContent = `${totalCount.toLocaleString()} 回再生`;
      }

      if (currentData !== undefined) {
        const curItem = currentData?.item;
        if (curItem && curItem.isPlaying !== false && curItem.track) {
          const parsed = extractStatsFmTrack(curItem.track, curItem.platform);
          if (parsed) {
            const progressMs = Number(curItem.progressMs || 0);
            statsFmCurrentTrack = {
              ...parsed,
              start: progressMs > 0 ? Math.max(0, (currentFetchedAt || Date.now()) - progressMs) : 0
            };
          }
        } else {
          statsFmCurrentTrack = null;
        }
      }

      if (recentData && Array.isArray(recentData.items)) {
        statsFmRecentStreams = recentData.items
          .map(entry => {
            const parsed = extractStatsFmTrack(entry?.track, entry?.platform);
            return parsed ? { ...parsed, isNow: false, endTimeMs: entry?.endTime ? Date.parse(entry.endTime) : 0 } : null;
          })
          .filter(Boolean);
      }

      syncActivityUI();
      renderRecentTracks();
    }

    let statsFmPollTimer = null;
    let statsFmBackoffMs = 25000;
    let statsFmFetching = false;

    async function fetchStatsFm() {
      if (statsFmFetching) return;
      statsFmFetching = true;
      clearTimeout(statsFmPollTimer);

      try {
        const [curRes, recRes, totalRes] = await Promise.all([
          fetchJsonGuarded(`${STATSFM_API_BASE}/streams/current`, { cacheKey: 'statsfm_current', ttlMs: 15000 }),
          fetchJsonGuarded(`${STATSFM_API_BASE}/streams/recent?limit=10`, { cacheKey: 'statsfm_recent_10', ttlMs: 30000 }),
          fetchJsonGuarded(`${STATSFM_API_BASE}/streams/stats?range=lifetime`, { cacheKey: 'statsfm_total', ttlMs: 300000 })
        ]);

        const curEntry = readCacheEntry('statsfm_current');
        applyStatsFmData({
          currentData: curRes.ok ? curRes.data : undefined,
          recentData: recRes.ok ? recRes.data : null,
          totalData: totalRes.ok ? totalRes.data : null,
          currentFetchedAt: curEntry?.ts || Date.now()
        });

        const hadError = (!recRes.ok && !curRes.ok) || recRes.rateLimited || curRes.rateLimited;
        statsFmBackoffMs = hadError ? Math.min(300000, statsFmBackoffMs * 2) : 25000;
      } finally {
        statsFmFetching = false;
        if (document.visibilityState === 'visible') {
          statsFmPollTimer = setTimeout(fetchStatsFm, statsFmBackoffMs);
        }
      }
    }

    document.addEventListener('visibilitychange', () => {
      const hidden = document.visibilityState === 'hidden';
      document.documentElement.classList.toggle('is-hidden', hidden);
      syncPlaybackTimer();
      syncRelativeTimeTimer();
      if (!hidden) {
        if (!activeWs) {
          wsAttempt = 0;
          connectLanyardWs();
        }
        updateRelativeTimes();
        fetchStatsFm();
        tickFloatingLyrics();
      } else {
        clearTimeout(statsFmPollTimer);
        clearTimeout(wsReconnectTimer);
      }
    });

    window.addEventListener('online', () => {
      wsAttempt = 0;
      connectLanyardWs();
      statsFmBackoffMs = 25000;
      fetchStatsFm();
    });

    const tabLabels = { music: '音楽', setup: '環境', projects: '制作' };
    const tabOrder = ['music', 'setup', 'projects'];
    let currentTab = 'music';
    let tabMenuOpen = false;

    const tabTriggerBtn = document.getElementById('tab-trigger-btn');
    const tabActiveLabel = document.getElementById('tab-active-label');
    const tabOptionsWrap = document.getElementById('tab-options-wrap');
    const tabOptionsInner = document.getElementById('tab-options-inner');
    const panels = {
      music: document.getElementById('panel-music'),
      setup: document.getElementById('panel-setup'),
      projects: document.getElementById('panel-projects')
    };

    function getTabFromHash() {
      const raw = window.location.hash.replace(/^#\/?/, '').trim().toLowerCase();
      return tabOrder.includes(raw) ? raw : null;
    }

    function syncTabHash(tab, push = true) {
      const targetHash = `#${tab}`;
      if (window.location.hash === targetHash) return;
      try {
        if (push) history.pushState(null, '', targetHash);
        else history.replaceState(null, '', targetHash);
      } catch (_) {
        window.location.hash = targetHash;
      }
    }

    function applyTabDOM(nextTab, animate = true) {
      currentTab = nextTab;
      if (tabActiveLabel) tabActiveLabel.textContent = tabLabels[nextTab];
      Object.entries(panels).forEach(([key, panel]) => {
        if (!panel) return;
        if (key === nextTab) {
          panel.classList.remove('is-hidden-panel', 'tab-animate');
          if (animate) {
            void panel.offsetWidth;
            panel.classList.add('tab-animate');
          }
        } else {
          panel.classList.add('is-hidden-panel');
          panel.classList.remove('tab-animate');
        }
      });
    }

    function renderTabChoices() {
      if (!tabOptionsInner) return;
      tabOptionsInner.innerHTML = tabOrder
        .filter(t => t !== currentTab)
        .map(tab => `<button type="button" data-tab="${tab}" class="link-muted tab-choice">${tabLabels[tab]}</button>`)
        .join('');
    }

    tabOptionsInner?.addEventListener('click', (e) => {
      const btn = e.target.closest?.('button[data-tab]');
      if (!btn) return;
      e.stopPropagation();
      selectTab(btn.getAttribute('data-tab'));
    });

    function setTabMenuOpen(open) {
      tabMenuOpen = open;
      if (open) renderTabChoices();
      tabOptionsWrap?.setAttribute('data-open', open ? 'true' : 'false');
      tabTriggerBtn?.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function selectTab(nextTab, { updateHash = true, animate = true } = {}) {
      setTabMenuOpen(false);
      if (!nextTab || !panels[nextTab]) return;
      if (updateHash) syncTabHash(nextTab, true);
      if (nextTab === currentTab) return;

      if (!animate) {
        applyTabDOM(nextTab, false);
        return;
      }

      animateContainerHeight(
        document.getElementById('panels-viewport'),
        document.getElementById('panels-inner'),
        () => applyTabDOM(nextTab, true)
      );
    }

    (() => {
      const initialTab = getTabFromHash() || 'music';
      applyTabDOM(initialTab, false);
      syncTabHash(initialTab, false);
    })();

    window.addEventListener('hashchange', () => {
      const hashTab = getTabFromHash();
      if (hashTab && hashTab !== currentTab) {
        selectTab(hashTab, { updateHash: false, animate: true });
      }
    });

    tabTriggerBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      setTabMenuOpen(!tabMenuOpen);
    });
    document.addEventListener('click', () => { if (tabMenuOpen) setTabMenuOpen(false); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (tabMenuOpen) setTabMenuOpen(false);
        closeContextMenu();
      }
    });

    const discordServers = [
      { code: 'rKZGYvmUUC', nameId: 'server-one-name', membersId: 'server-one-members', descId: 'server-one-desc', iconId: 'server-one-icon' },
      { code: 'zZf4RAP6Gq', nameId: 'server-two-name', membersId: 'server-two-members', descId: 'server-two-desc', iconId: 'server-two-icon' }
    ];

    function applyDiscordServerData(s, data) {
      const g = data?.guild;
      if (!g) return;
      const nameEl = document.getElementById(s.nameId);
      const membersEl = document.getElementById(s.membersId);
      const descEl = document.getElementById(s.descId);
      const iconEl = document.getElementById(s.iconId);

      if (nameEl && g.name) nameEl.textContent = g.name;
      if (descEl) {
        descEl.textContent = typeof g.description === 'string' ? g.description.trim() : '';
      }
      if (membersEl && typeof data.approximate_member_count === 'number') {
        membersEl.textContent = `${data.approximate_member_count.toLocaleString()} 人`;
      }
      if (g.icon && iconEl) {
        const ext = g.icon.startsWith('a_') ? 'gif' : 'png';
        iconEl.src = `https://cdn.discordapp.com/icons/${encodeURIComponent(g.id)}/${encodeURIComponent(g.icon)}.${ext}?size=128`;
      }
    }

    async function fetchDiscordServers() {
      await Promise.all(discordServers.map(async (s) => {
        const res = await fetchJsonGuarded(`https://discord.com/api/v9/invites/${encodeURIComponent(s.code)}?with_counts=true`, {
          cacheKey: `dc_inv_${s.code}`,
          ttlMs: 600000
        });
        if (res.ok && res.data) applyDiscordServerData(s, res.data);
      }));
    }

    function hydrateFromCache() {
      const dstn = readCache('dstn_profile', true);
      if (dstn?.user) applyUserProfile(dstn.user);
      if (Array.isArray(dstn?.badges)) applyDiscordBadges(dstn.badges);

      const lanEntry = readCacheEntry('lanyard_init');
      if (lanEntry?.val?.data) {
        if (lanEntry.val.data.discord_user) applyUserProfile(lanEntry.val.data.discord_user);
        const savedAt = lanEntry.ts || (lanEntry.exp - 10000);
        if (Date.now() - savedAt < 120000) handleLanyardPresence(lanEntry.val.data);
      }

      const curEntry = readCacheEntry('statsfm_current');
      applyStatsFmData({
        currentData: curEntry && (Date.now() - (curEntry.ts || 0) < 120000) ? curEntry.val : undefined,
        recentData: readCache('statsfm_recent_10', true),
        totalData: readCache('statsfm_total', true),
        currentFetchedAt: curEntry?.ts
      });

      discordServers.forEach(s => {
        const inv = readCache(`dc_inv_${s.code}`, true);
        if (inv) applyDiscordServerData(s, inv);
      });
    }

    const bgReady = loadBackgroundImage(BACKGROUND_FILES);
    runIntroSequence(bgReady);
    hydrateFromCache();
    syncRelativeTimeTimer();
    initLanyard();
    fetchDstnProfile();
    fetchStatsFm();
    fetchDiscordServers();
  </script>
</body>
</html>
